<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSBridge Demo</title>
  <style>
    html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:680px;margin:24px auto;padding:16px}
    .row{display:flex;gap:12px;margin:12px 0}
    button{padding:10px 14px;border:1px solid #ccc;border-radius:8px;background:#f6f6f6;cursor:pointer}
    button:active{background:#eaeaea}
    .status{margin-top:8px;color:#555}
    .panel{margin-top:16px;padding:12px;border:1px solid #eee;border-radius:8px}
    .panel h2{margin:0 0 8px;font-size:16px}
    pre{white-space:pre-wrap;word-break:break-word}
    img{max-width:100%;height:auto}
  </style>
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <div class="wrap">
    <h1>JSBridge 交互</h1>
    <div class="row">
      <button id="btnPhoto">拍照</button>
      <button id="btnInfo">获取信息</button>
    </div>
    <div id="status" class="status"></div>
    <div class="panel">
      <h2>原生信息</h2>
      <pre id="result"></pre>
    </div>
    <div class="panel">
      <h2>图片</h2>
      <div id="imageContainer"></div>
    </div>
  </div>
  <script>
    const ui={status:document.getElementById("status"),result:document.getElementById("result"),image:document.getElementById("imageContainer")};
    function setStatus(t){ui.status.textContent=t}

    const Bridge=(()=>{
      function detect(){
        if(window.WebViewJavascriptBridge&&typeof window.WebViewJavascriptBridge.callHandler==="function")return"wvjb";
        if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.jsBridge&&typeof window.webkit.messageHandlers.jsBridge.postMessage==="function")return"ios";
        if(window.Android)return"android";
        return"none";
      }
      const type=detect();
      function call(method,params){
        return new Promise((resolve,reject)=>{
          try{
            if(type==="wvjb"){
              window.WebViewJavascriptBridge.callHandler(method,params,(response)=>resolve(response));
            }else if(type==="ios"){
              const token="cb_"+Date.now()+"_"+Math.random().toString(16).slice(2);
              window.__bridge_callbacks=window.__bridge_callbacks||{};
              window.__bridge_callbacks[token]=resolve;
              window.webkit.messageHandlers.jsBridge.postMessage({method,params,callback:token});
            }else if(type==="android"){
              if(typeof window.Android[method]==="function"){
                const res=window.Android[method](JSON.stringify(params||{}));
                try{resolve(JSON.parse(res))}catch(_){resolve(res)}
              }else if(typeof window.Android.postMessage==="function"){
                const token="cb_"+Date.now()+"_"+Math.random().toString(16).slice(2);
                window.__bridge_callbacks=window.__bridge_callbacks||{};
                window.__bridge_callbacks[token]=resolve;
                window.Android.postMessage(JSON.stringify({method,params,callback:token}));
              }else{
                reject(new Error("Android bridge not available"));
              }
            }else{
              setTimeout(()=>{
                if(method==="getInfo")resolve({platform:"web",time:new Date().toISOString()});
                else if(method==="takePhoto")resolve({image:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150"><rect width="200" height="150" fill="#eee"/><text x="50" y="85" font-size="14" fill="#333">No native</text></svg>')});
                else resolve(null);
              },300);
            }
          }catch(e){reject(e)}
        })
      }
      function onNativeCallback(token,payload){
        const map=window.__bridge_callbacks||{};
        const cb=map[token];
        if(cb){cb(payload);delete map[token]}
      }
      return{call,onNativeCallback,type}
    })();

    window.onNativeCallback=function(token,payload){Bridge.onNativeCallback(token,payload)};
    window.onNativeInfo=function(payload){renderInfo(payload)};
    window.onNativePhoto=function(payload){renderPhoto(payload)};

    function renderInfo(data){ui.result.textContent=typeof data==="string"?data:JSON.stringify(data,null,2)}
    function renderPhoto(data){
      const url=data&&data.image?data.image:data;
      ui.image.innerHTML="";
      if(url){
        const img=new Image();
        img.src=url;img.alt="拍照图片";img.style.maxWidth="100%";ui.image.appendChild(img)
      }
    }

    document.getElementById("btnPhoto").addEventListener("click",async()=>{
      setStatus("调用拍照中");
      try{const res=await Bridge.call("takePhoto",{});renderPhoto(res);setStatus("已获取图片")}catch(e){setStatus("拍照失败")}
    });
    document.getElementById("btnInfo").addEventListener("click",async()=>{
      setStatus("获取信息中");
      try{const res=await Bridge.call("getInfo",{});renderInfo(res);setStatus("已获取信息")}catch(e){setStatus("获取信息失败")}
    });
  </script>
</body>
</html>
